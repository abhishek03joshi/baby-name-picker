[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baby-name-picker"
version = "0.1.0"
description = "A fair, reproducible best-of-three baby-name picker."
readme = "README.md"
requires-python = ">=3.15"
license = { text = "MIT" }
authors = [{ name = "The Name-Picking Family" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
name-picker = "name_picker.cli:main"
name-picker-gui = "name_picker.gui:main"
name-picker-sim = "name_picker.simulation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
